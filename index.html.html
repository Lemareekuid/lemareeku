<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemareeku | Temukan Tas Favoritmu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F8F4EC;
    --ivory: #FFFDF8;
    --mahogany: #4A2523;
    --mahogany-light: #70433D;
    --text: #402321;
    --border: #D8C9B8;
    --soft-pink: #F1E3DC;
}

* {
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.7;
}

button, input, textarea {
    font-family: Arial, sans-serif;
}

/* HEADER */

header {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 350px;
    background-color: var(--cream);
    background-image: url("img/po.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
    border-bottom: 1px solid var(--border);
}

header::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        rgba(255, 253, 248, 0.72) 0%,
        rgba(255, 253, 248, 0.48) 28%,
        rgba(255, 253, 248, 0.18) 52%,
        rgba(255, 253, 248, 0) 75%
    );
}

header h1, header p {
    position: relative;
    z-index: 1;
}

header h1 {
    margin: 0;
    color: var(--mahogany);
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.7);
}

header p {
    margin: 8px 0 0;
    color: var(--mahogany-light);
    font-size: 15px;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
}

/* NAVIGASI */

nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 12px;
    background: var(--mahogany);
    box-shadow: 0 3px 10px rgba(74, 37, 35, 0.12);
}

nav a {
    color: var(--cream);
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover, nav a.aktif {
    background: var(--cream);
    color: var(--mahogany);
}

/* KONTEN */

#konten {
    background: var(--ivory);
    margin: 28px auto;
    padding: 35px;
    width: calc(100% - 40px);
    max-width: 1250px;
    min-height: 420px;
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 5px 18px rgba(74, 37, 35, 0.07);
}

#konten h2 {
    color: var(--mahogany);
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.3;
}

#konten h3 {
    color: var(--mahogany-light);
    font-family: 'Playfair Display', serif;
    font-size: 25px;
    font-weight: 700;
}

.judul-bagian {
    text-align: center;
    margin-bottom: 8px;
}

.deskripsi-bagian {
    text-align: center;
    color: var(--mahogany-light);
    font-size: 14px;
    line-height: 1.8;
    margin: 0 auto 25px;
    max-width: 650px;
}

.garis-hias {
    width: 40px;
    height: 2px;
    background: var(--mahogany-light);
    border-radius: 10px;
    margin: 12px auto 25px;
}

/* MINI-GAME TAS */

.game-petunjuk {
    max-width: 700px;
    margin: 28px auto 12px;
    text-align: center;
    color: var(--mahogany);
    font-size: 15px;
    font-weight: bold;
    line-height: 1.8;
}

.game-visual {
    position: relative;
    width: 100%;
    max-width: 1100px;
    height: 520px;
    margin: 20px auto 10px;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center,
            #FFFDF8 0%,
            #F8F0E7 72%,
            #F1E3DC 100%
        );
    border-radius: 22px;
    isolation: isolate;
    user-select: none;
    -webkit-user-select: none;
}

.game-scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

/* PAPER BAG */

.game-bag {
    position: absolute;
    z-index: 3;
    width: 190px;
    height: 220px;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: linear-gradient(
        110deg,
        #B98764 0%,
        #E8C8A7 38%,
        #D8B18D 70%,
        #B98764 100%
    );
    clip-path: polygon(9% 12%, 91% 12%, 100% 100%, 0 100%);
    filter: drop-shadow(0 10px 9px rgba(74, 37, 35, 0.18));
    pointer-events: none;
}

/* PEGANGAN PAPER BAG */

.game-bag-handle {
    position: absolute;
    z-index: 2;
    width: 70px;
    height: 65px;
    left: 50%;
    bottom: 190px;
    transform: translateX(-50%);
    border: 9px solid #B98764;
    border-bottom: none;
    border-radius: 38px 38px 0 0;
    pointer-events: none;
}

/* ISI PAPER BAG */

.game-bag-isi {
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    width: 170px;
    height: 150px;
    display: flex;
    align-content: flex-end;
    justify-content: center;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0;
    overflow: hidden;
    pointer-events: none;
}

/* FOTO TAS BERSERAKAN - TANPA KOTAK BACKGROUND */

.game-photo {
    position: absolute;
    z-index: 5;
    width: 112px;
    height: 112px;
    padding: 0;
    object-fit: contain;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    filter: drop-shadow(0 3px 5px rgba(74, 37, 35, 0.10));
    cursor: grab;
    touch-action: none;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    transition: filter 0.2s;
}

.game-photo:hover {
    filter: drop-shadow(0 7px 9px rgba(74, 37, 35, 0.18));
}

.game-photo:active {
    cursor: grabbing;
}

.game-photo.sedang-diseret {
    z-index: 20;
    cursor: grabbing;
    filter: drop-shadow(0 10px 13px rgba(74, 37, 35, 0.22));
    transition: none;
}

/* FOTO DI DALAM PAPER BAG - TANPA KOTAK */

.game-photo-dalam {
    width: 48%;
    height: 68px;
    object-fit: contain;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 0;
    filter: drop-shadow(0 2px 3px rgba(74, 37, 35, 0.08));
    animation: tasMasukBag 0.35s ease;
}

@keyframes tasMasukBag {
    from {
        opacity: 0;
        transform: translateY(-15px) scale(0.7);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ANIMASI PAPER BAG */

.game-bag.animasi-bag {
    animation: bagBounce 0.4s ease;
}

@keyframes bagBounce {
    0% {
        transform: translateX(-50%) scale(1);
    }

    35% {
        transform: translateX(-50%) scale(1.05) rotate(-2deg);
    }

    70% {
        transform: translateX(-50%) scale(0.98) rotate(2deg);
    }

    100% {
        transform: translateX(-50%) scale(1);
    }
}

/* TOMBOL DAN PESAN MINI-GAME */

.game-konfirmasi {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin: 20px auto 10px;
    text-align: center;
}

.game-tombol-pilihan {
    display: inline-block;
    padding: 12px 24px;
    border: none;
    border-radius: 30px;
    background: var(--mahogany);
    color: var(--ivory);
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.25s, background 0.25s;
}

.game-tombol-pilihan:hover {
    background: var(--mahogany-light);
    transform: translateY(-2px);
}

.game-pesan-akhir {
    display: none;
    max-width: 500px;
    margin: 15px auto 0;
    color: var(--mahogany);
    font-size: 17px;
    font-weight: bold;
    line-height: 1.8;
    text-align: center;
}

.game-pesan-akhir.tampil {
    display: block;
    animation: pesanMuncul 0.7s ease both;
}

@keyframes pesanMuncul {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* PAPER BAG MEMBESAR */

.game-visual.pilihan-final .game-bag {
    animation: bagMembesar 0.8s ease forwards;
    transform-origin: bottom center;
}

.game-visual.pilihan-final .game-bag-handle {
    animation: handleMembesar 0.8s ease forwards;
    transform-origin: bottom center;
}

.game-visual.pilihan-final .game-bag-isi {
    animation: isiBagMembesar 0.8s ease forwards;
    transform-origin: bottom center;
}

@keyframes bagMembesar {
    0% {
        transform: translateX(-50%) scale(1);
    }

    55% {
        transform: translateX(-50%) scale(1.18) rotate(-3deg);
    }

    75% {
        transform: translateX(-50%) scale(0.98) rotate(2deg);
    }

    100% {
        transform: translateX(-50%) scale(1.15);
    }
}

@keyframes handleMembesar {
    0% {
        transform: translateX(-50%) scale(1);
    }

    100% {
        transform: translateX(-50%) scale(1.15);
    }
}

@keyframes isiBagMembesar {
    0% {
        transform: translateX(-50%) scale(1);
    }

    100% {
        transform: translateX(-50%) scale(1.15);
    }
}

/* EFEK DEKORATIF */

.game-konfeti {
    position: absolute;
    z-index: 30;
    top: 45%;
    left: 50%;
    font-size: 22px;
    pointer-events: none;
    animation: konfetiTerbang 1.1s ease-out forwards;
}

@keyframes konfetiTerbang {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(
            calc(-50% + var(--gerak-x)),
            calc(-50% + var(--gerak-y))
        ) scale(1.2) rotate(180deg);
    }
}

.game-visual.pilihan-final .game-photo {
    pointer-events: none;
}

/* CAROUSEL FOTO TAS */

.carousel-profil {
    position: relative;
    margin: 25px auto 35px;
    max-width: 1050px;
    overflow: hidden;
    border-radius: 18px;
    background: var(--cream);
    border: 1px solid var(--border);
    padding: 15px;
}

.carousel-profil-track {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    padding: 3px;
}

.carousel-profil-track::-webkit-scrollbar {
    display: none;
}

.item-carousel-profil {
    flex: 0 0 calc(25% - 12px);
    min-width: 0;
    scroll-snap-align: start;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--ivory);
    padding: 8px;
    cursor: pointer;
    text-align: left;
    color: var(--mahogany);
    transition: transform 0.3s, box-shadow 0.3s;
}

.item-carousel-profil:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 15px rgba(74, 37, 35, 0.12);
}

.item-carousel-profil img {
    display: block;
    width: 100%;
    height: 175px;
    object-fit: contain;
    background: var(--ivory);
    border-radius: 10px;
}

.item-carousel-profil h4 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    margin: 10px 2px 3px;
}

.item-carousel-profil p {
    font-size: 13px;
    font-weight: bold;
    color: var(--mahogany-light);
    margin: 0 2px 5px;
}

.carousel-profil-header {
    text-align: center;
    margin-bottom: 18px;
}

.carousel-profil-header h3 {
    font-family: 'Playfair Display', serif;
    color: var(--mahogany);
    font-size: 25px;
    margin: 0 0 5px;
}

.carousel-profil-header p {
    color: var(--mahogany-light);
    font-size: 13px;
    margin: 0;
}

.carousel-profil-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
}

.carousel-profil-controls button {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--ivory);
    color: var(--mahogany);
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.carousel-profil-controls button:hover {
    background: var(--mahogany);
    color: var(--ivory);
}

/* BERANDA */

.hero-beranda {
    text-align: center;
    padding: 25px 10px 35px;
}

.label-kecil {
    display: inline-block;
    background: var(--soft-pink);
    color: var(--mahogany);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: bold;
}

.hero-beranda h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 5vw, 50px) !important;
    font-weight: 700;
    line-height: 1.2;
    max-width: 750px;
    margin: 20px auto 12px;
}

.hero-beranda p {
    font-size: 14px;
    line-height: 1.8;
    max-width: 650px;
    margin: 0 auto 20px;
}

.tombol {
    display: inline-block;
    background: var(--mahogany);
    color: var(--ivory);
    padding: 11px 20px;
    border: 1px solid var(--mahogany);
    border-radius: 25px;
    text-decoration: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: 0.3s;
}

.tombol:hover {
    background: var(--mahogany-light);
    border-color: var(--mahogany-light);
    transform: translateY(-2px);
}

.tombol-sekunder {
    background: transparent;
    color: var(--mahogany);
}

.tombol-sekunder:hover {
    color: white;
}

/* KEUNGGULAN */

.keunggulan {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin: 20px 0 40px;
}

.kartu-keunggulan {
    text-align: center;
    padding: 22px 15px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--cream);
}

.kartu-keunggulan .ikon {
    font-size: 27px;
}

.kartu-keunggulan h3 {
    font-size: 23px;
    margin: 8px 0;
}

.kartu-keunggulan p {
    font-size: 14px;
    line-height: 1.8;
    margin: 0;
}

/* KATEGORI */

.kategori-container {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin: 25px 0 40px;
}

.kategori {
    background: var(--soft-pink);
    padding: 24px 12px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid var(--border);
}

.kategori h3 {
    font-size: 23px;
    margin: 0 0 6px;
}

.kategori p {
    font-size: 14px;
    line-height: 1.8;
    margin: 0;
}

/* PRODUK */

.produk-container {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.produk {
    display: flex;
    flex-direction: column;
    background: var(--cream);
    padding: 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    min-width: 0;
    transition: 0.3s;
}

.produk:hover {
    transform: translateY(-4px);
    box-shadow: 0 7px 18px rgba(74, 37, 35, 0.12);
}

.gambar-produk {
    display: block;
    width: 100%;
    padding: 0;
    border: none;
    border-radius: 12px;
    background: var(--ivory);
    cursor: pointer;
    overflow: hidden;
}

.gambar-produk img {
    display: block;
    width: 100%;
    height: 190px;
    object-fit: contain;
    object-position: center;
    background: var(--ivory);
    transition: transform 0.3s;
}

.gambar-produk:hover img {
    transform: scale(1.04);
}

.petunjuk-gambar {
    font-size: 11px;
    color: var(--mahogany-light);
    text-align: center;
    margin: 5px 0 0;
}

.produk h4 {
    color: var(--mahogany);
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    font-weight: 700;
    margin: 12px 0 5px;
    min-height: 24px;
}

.harga {
    font-size: 14px;
    font-weight: bold;
    color: var(--mahogany-light);
    margin: 0 0 10px;
}

.produk .tombol {
    margin-top: auto;
    align-self: flex-start;
}

.label-produk {
    font-size: 10px;
    color: var(--mahogany-light);
    background: var(--soft-pink);
    padding: 3px 8px;
    border-radius: 12px;
    align-self: flex-start;
    margin-top: 7px;
}

/* DETAIL PRODUK */

.detail-produk {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 35px;
    align-items: start;
    max-width: 1050px;
    margin: 30px auto;
}

.detail-gambar {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
}

.detail-gambar img {
    width: 100%;
    height: 460px;
    object-fit: contain;
    display: block;
    background: var(--ivory);
    border-radius: 12px;
}

.detail-info {
    padding: 10px 0;
}

.detail-info h2 {
    margin-top: 10px;
    margin-bottom: 8px;
}

.detail-harga {
    font-size: 23px;
    font-weight: bold;
    color: var(--mahogany-light);
    margin: 10px 0 20px;
}

.detail-deskripsi {
    font-size: 14px;
    line-height: 1.9;
}

.detail-info hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
}

.info-detail {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

.info-detail strong {
    color: var(--mahogany);
    flex-shrink: 0;
}

.info-detail span {
    text-align: right;
}

.label-detail {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: var(--mahogany);
    margin-top: 20px;
}

.jumlah-detail {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 10px 0 20px;
}

.jumlah-detail button {
    width: 35px;
    height: 35px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--cream);
    color: var(--mahogany);
    font-size: 18px;
    cursor: pointer;
}

.jumlah-detail span {
    min-width: 20px;
    text-align: center;
    font-weight: bold;
}

.detail-tombol {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

/* KERANJANG */

.bagian-belanja {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 25px;
    margin-top: 35px;
}

.bagian-belanja h2 {
    text-align: center;
}

.item-keranjang {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding: 15px 0;
    flex-wrap: wrap;
}

.kontrol-jumlah {
    display: flex;
    align-items: center;
    gap: 7px;
}

.kontrol-jumlah button {
    background: var(--mahogany);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 6px 11px;
    cursor: pointer;
}

.kontrol-jumlah .hapus {
    background: var(--mahogany-light);
}

.total-harga {
    text-align: right;
    color: var(--mahogany);
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
}

.kosong {
    text-align: center;
    padding: 15px;
    color: var(--mahogany-light);
}

/* FORM PEMESANAN */

.form-pemesanan label {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
    color: var(--mahogany);
}

.form-pemesanan input,
.form-pemesanan textarea {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--ivory);
    color: var(--text);
    font-size: 14px;
}

.form-pemesanan input:focus,
.form-pemesanan textarea:focus {
    outline: 2px solid var(--mahogany-light);
}

/* KARTU INFORMASI */

.kartu-info {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 25px;

}

/* SERET FOTO TAS */

let fotoSedangDiseret = null;
let offsetSeretX = 0;
let offsetSeretY = 0;
let posisiAwalX = 0;
let posisiAwalY = 0;

function mulaiSeretFoto(event) {
    if (event.button !== undefined && event.button !== 0) return;

    const game = document.getElementById("game-visual");

    if (game && game.classList.contains("pilihan-final")) return;

    const foto = event.currentTarget;
    const scene = document.getElementById("game-scene");

    if (!scene || !foto) return;

    fotoSedangDiseret = foto;

    const fotoRect = foto.getBoundingClientRect();

    offsetSeretX = event.clientX - fotoRect.left;
    offsetSeretY = event.clientY - fotoRect.top;

    const sceneRect = scene.getBoundingClientRect();

    posisiAwalX = fotoRect.left - sceneRect.left;
    posisiAwalY = fotoRect.top - sceneRect.top;

    foto.style.left = posisiAwalX + "px";
    foto.style.top = posisiAwalY + "px";
    foto.style.transform = "rotate(0deg)";
    foto.classList.add("sedang-diseret");

    foto.setPointerCapture(event.pointerId);

    foto.addEventListener("pointermove", gerakkanFoto);
    foto.addEventListener("pointerup", akhiriSeretFoto);
    foto.addEventListener("pointercancel", batalkanSeretFoto);

    event.preventDefault();
}

/* GERAKKAN FOTO MENGIKUTI JARI ATAU MOUSE */

function gerakkanFoto(event) {
    if (!fotoSedangDiseret) return;

    const scene = document.getElementById("game-scene");

    if (!scene) return;

    const sceneRect = scene.getBoundingClientRect();

    let x = event.clientX - sceneRect.left - offsetSeretX;
    let y = event.clientY - sceneRect.top - offsetSeretY;

    const maxX = scene.clientWidth - fotoSedangDiseret.offsetWidth;
    const maxY = scene.clientHeight - fotoSedangDiseret.offsetHeight;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    fotoSedangDiseret.style.left = x + "px";
    fotoSedangDiseret.style.top = y + "px";
}

/* SELESAI MENYERET FOTO */

function akhiriSeretFoto(event) {
    if (!fotoSedangDiseret) return;

    const foto = fotoSedangDiseret;
    const bag = document.getElementById("game-bag");
    const isiBag = document.getElementById("game-bag-isi");

    foto.removeEventListener("pointermove", gerakkanFoto);
    foto.removeEventListener("pointerup", akhiriSeretFoto);
    foto.removeEventListener("pointercancel", batalkanSeretFoto);

    foto.classList.remove("sedang-diseret");

    const fotoRect = foto.getBoundingClientRect();
    const bagRect = bag.getBoundingClientRect();

    const tengahX = fotoRect.left + fotoRect.width / 2;
    const tengahY = fotoRect.top + fotoRect.height / 2;

    const masukBag =
        tengahX >= bagRect.left &&
        tengahX <= bagRect.right &&
        tengahY >= bagRect.top &&
        tengahY <= bagRect.bottom;

    if (masukBag) {
        masukkanFotoKeBag(foto, isiBag);
    } else {
        foto.style.left = posisiAwalX + "px";
        foto.style.top = posisiAwalY + "px";
        foto.style.transform = "rotate(0deg)";
    }

    fotoSedangDiseret = null;
}

/* BATALKAN SERET */

function batalkanSeretFoto() {
    if (!fotoSedangDiseret) return;

    const foto = fotoSedangDiseret;

    foto.removeEventListener("pointermove", gerakkanFoto);
    foto.removeEventListener("pointerup", akhiriSeretFoto);
    foto.removeEventListener("pointercancel", batalkanSeretFoto);

    foto.classList.remove("sedang-diseret");
    foto.style.left = posisiAwalX + "px";
    foto.style.top = posisiAwalY + "px";

    fotoSedangDiseret = null;
}

/* MASUKKAN FOTO KE PAPER BAG */

function masukkanFotoKeBag(foto, isiBag) {
    const id = Number(foto.dataset.produkId);
    const produk = daftarProduk.find(p => p.id === id);

    if (!produk || !isiBag) return;

    tasPilihanGame.push(produk);

    const fotoBaru = document.createElement("img");

    fotoBaru.src = "img/" + produk.gambar;
    fotoBaru.alt = produk.nama;
    fotoBaru.className = "game-photo-dalam";

    isiBag.appendChild(fotoBaru);
    foto.remove();

    const bag = document.getElementById("game-bag");

    if (bag) {
        bag.classList.remove("animasi-bag");
        void bag.offsetWidth;
        bag.classList.add("animasi-bag");
    }
}

/* KONFIRMASI TAS FAVORIT */

function konfirmasiPilihanTas() {
    const game = document.getElementById("game-visual");
    const tombol = document.getElementById("game-tombol-pilihan");
    const pesan = document.getElementById("game-pesan-akhir");
    const petunjuk = document.getElementById("game-petunjuk");
    const tombolPesan = document.getElementById("game-pesan-tombol");

    if (!game || !tombol || !pesan) return;

    if (game.classList.contains("pilihan-final")) return;

    game.classList.add("pilihan-final");
    tombol.style.display = "none";

    if (petunjuk) {
        petunjuk.style.display = "none";
    }

    if (fotoSedangDiseret) {
        batalkanSeretFoto();
    }

    const simbol = ["✦", "♡", "✧", "✿", "⋆", "♥", "✦", "♡"];

    simbol.forEach((karakter, index) => {
        const konfeti = document.createElement("span");

        konfeti.className = "game-konfeti";
        konfeti.textContent = karakter;

        const sudut = (Math.PI * 2 * index) / simbol.length;
        const jarak = 100 + Math.random() * 90;

        konfeti.style.setProperty(
            "--gerak-x",
            Math.cos(sudut) * jarak + "px"
        );

        konfeti.style.setProperty(
            "--gerak-y",
            Math.sin(sudut) * jarak + "px"
        );

        konfeti.style.animationDelay = (index * 0.04) + "s";

        game.appendChild(konfeti);

        setTimeout(() => konfeti.remove(), 1500);
    });

    setTimeout(() => {
        pesan.classList.add("tampil");

        if (tombolPesan) {
            tombolPesan.style.display = "flex";
        }
    }, 350);
}

/* CAROUSEL FOTO TAS */

function geserCarouselProfil(arah) {
    const track = document.getElementById("carousel-profil-track");

    if (!track) return;

    const item = track.querySelector(".item-carousel-profil");

    if (!item) return;

    const jarak = item.getBoundingClientRect().width + 15;
    const batasKanan = track.scrollWidth - track.clientWidth;
    const posisiBerikutnya = track.scrollLeft + (jarak * arah);

    if (posisiBerikutnya > batasKanan + 2) {
        track.scrollTo({
            left: 0,
            behavior: "smooth"
        });
    } else if (posisiBerikutnya < 0) {
        track.scrollTo({
            left: batasKanan,
            behavior: "smooth"
        });
    } else {
        track.scrollBy({
            left: jarak * arah,
            behavior: "smooth"
        });
    }
}

/* CAROUSEL OTOMATIS JIKA DIGUNAKAN */

function mulaiCarouselProfil() {
    const track = document.getElementById("carousel-profil-track");

    if (!track) return;

    track.addEventListener("mouseenter", hentikanCarouselProfil);
    track.addEventListener("mouseleave", jalankanCarouselProfil);

    track.addEventListener("touchstart", hentikanCarouselProfil, {
        passive: true
    });

    track.addEventListener("touchend", jalankanCarouselProfil, {
        passive: true
    });

    jalankanCarouselProfil();
}

function jalankanCarouselProfil() {
    hentikanCarouselProfil();

    intervalCarouselProfil = setInterval(() => {
        const track = document.getElementById("carousel-profil-track");

        if (!track) {
            hentikanCarouselProfil();
            return;
        }

        geserCarouselProfil(1);
    }, 3000);
}

function hentikanCarouselProfil() {
    if (intervalCarouselProfil) {
        clearInterval(intervalCarouselProfil);
        intervalCarouselProfil = null;
    }
}

function ubahJumlahDetail(perubahan) {

        jumlahDetailAktif = 1;

    const elemen = document.getElementById("jumlah-detail");

    if (elemen) {
        elemen.textContent = jumlahDetailAktif;

/* TAMBAH PRODUK DARI DETAIL */

function tambahDetailKeKeranjang() {
    if (!produkDetailAktif) return;

    const produk = produkDetailAktif;
    const jumlah = jumlahDetailAktif;
    const idKeranjang = String(produk.id);

    const item = keranjang.find(p => p.idKeranjang === idKeranjang);

    if (item) {
        item.jumlah += jumlah;
    } else {
        keranjang.push({
            ...produk,
            idKeranjang: idKeranjang,
            jumlah: jumlah
        });
    }

    alert(`${produk.nama} berhasil ditambahkan ke keranjang!`);

    products();

    setTimeout(() => {
        const elemenKeranjang = document.getElementById("keranjang");

        if (elemenKeranjang) {

                behavior: "smooth",
                block: "start"
            });

}

/* TAMBAH PRODUK DARI KARTU */

function tambahKeranjang(id) {
    const produk = daftarProduk.find(p => p.id === id);

    if (!produk) return;

    const idKeranjang = String(produk.id);
    const item = keranjang.find(p => p.idKeranjang === idKeranjang);

    if (item) {
        item.jumlah++;
    } else {
        keranjang.push({
            ...produk,
            idKeranjang: idKeranjang,
            jumlah: 1
        });
    }

    tampilkanKeranjang();

    const elemenKeranjang = document.getElementById("keranjang");

    if (elemenKeranjang) {
        elemenKeranjang.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });
    }
}

/* UBAH JUMLAH PRODUK DI KERANJANG */

function ubahJumlah(idKeranjang, perubahan) {
    const item = keranjang.find(p => p.idKeranjang === idKeranjang);

    if (!item) return;

    item.jumlah += perubahan;

    if (item.jumlah <= 0) {
        keranjang = keranjang.filter(
            p => p.idKeranjang !== idKeranjang
        );
    }

    tampilkanKeranjang();
}

/* HAPUS PRODUK */

function hapusKeranjang(idKeranjang) {
    keranjang = keranjang.filter(
        p => p.idKeranjang !== idKeranjang
    );

    tampilkanKeranjang();
}

/* TAMPILKAN KERANJANG */

function tampilkanKeranjang() {
    const isi = document.getElementById("isi-keranjang");
    const totalElement = document.getElementById("total-harga");

    if (!isi || !totalElement) return;

    if (keranjang.length === 0) {
        isi.innerHTML = `
            <p class="kosong">Keranjangmu masih kosong. ♡</p>
        `;

        totalElement.textContent = formatRupiah(0);
        return;
    }

    isi.innerHTML = keranjang.map(p => `
        <div class="item-keranjang">
            <div>
                <strong>${p.nama}</strong><br>
                Ukuran: ${p.ukuran}<br>
                ${p.dimensi}<br>
                ${formatRupiah(p.harga)} × ${p.jumlah}<br>
                <strong>${formatRupiah(p.harga * p.jumlah)}</strong>
            </div>

            <div class="kontrol-jumlah">
                <button
                    type="button"
                    onclick="ubahJumlah('${p.idKeranjang}', -1)"
                >−</button>

                <span>${p.jumlah}</span>

                <button
                    type="button"
                    onclick="ubahJumlah('${p.idKeranjang}', 1)"
                >+</button>

                <button
                    type="button"
                    class="hapus"
                    onclick="hapusKeranjang('${p.idKeranjang}')"
                >
                    Hapus
                </button>
            </div>
        </div>
    `).join("");

    const total = keranjang.reduce(
        (jumlah, p) => jumlah + p.harga * p.jumlah,
        0
    );

    totalElement.textContent = formatRupiah(total);
}

/* PEMESANAN MELALUI WHATSAPP */

function pesanProduk(event) {
    event.preventDefault();

    if (keranjang.length === 0) {
        alert("Keranjangmu masih kosong. Silakan pilih produk terlebih dahulu.");
        return;
    }

    const nama = document.getElementById("nama-pembeli").value.trim();
    const nomor = document.getElementById("nomor-pembeli").value.trim();
    const alamat = document.getElementById("alamat-pembeli").value.trim();

    const total = keranjang.reduce(
        (jumlah, p) => jumlah + p.harga * p.jumlah,
        0
    );

    const rincian = keranjang.map(p =>
        `- ${p.nama} | Ukuran: ${p.ukuran} (${p.dimensi}) | ${p.jumlah} pcs = ${formatRupiah(p.harga * p.jumlah)}`
    ).join("\n");

    const pesan = `Halo, Toko Lemareeku! ♡

Saya ingin memesan produk berikut:

${rincian}

Total belanja: ${formatRupiah(total)}

Nama: ${nama}
Nomor WhatsApp: ${nomor}
Alamat pengiriman: ${alamat}

Mohon konfirmasi ketersediaan produk dan biaya pengiriman. Terima kasih!`;

    const url = "https://wa.me/" + nomorToko
        + "?text=" + encodeURIComponent(pesan);

    window.open(url, "_blank");
}
